<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ky-Basics - kyo.sk</title>
  <style>
    body {
      background: #00ff00;
      color: #000;
      font-family: 'Liberation Mono', 'Courier New', monospace;
      margin: 0;
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .back-link {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .back-link a {
      color: #000;
      text-decoration: none;
      border: 2px solid #000;
      padding: 8px 16px;
      display: inline-block;
    }

    .back-link a:hover {
      background: #000;
      color: #00ff00;
    }

    .awareness-container {
      max-width: 760px;
      margin: 0 auto;
    }

    .headline {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .headline-logo {
      height: 1.5em;
      width: auto;
      vertical-align: -0.12em;
    }

    .card {
      border-radius: 8px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.5rem;
    }

    .card p,
    .card li {
      margin: 0 0 0.9rem;
    }

    .card ol {
      padding-left: 1.3rem;
    }

    .card h2 {
      margin-top: 0;
    }

    .card-main {
      background: #70ff70;
      color: #000;
    }

    .card-note {
      background: #00c200;
      color: #000;
      font-weight: bold;
    }

    a {
      color: inherit;
    }

    @media screen and (max-width: 600px) {
      body {
        padding: 1rem 0.75rem;
      }

      .awareness-container {
        max-width: 100%;
      }

      .headline {
        font-size: 3.2rem;
        text-align: center;
      }

      .card {
        padding: 1.25rem 1.1rem;
        border-radius: 6px;
        font-size: 1.15rem;
      }

      .card h2 {
        font-size: 1.5rem;
      }

      .back-link a {
        font-size: 1.2rem;
      }
    }
  
    .lang-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .lang-switch button {
      background: none;
      color: #000;
      border: 2px solid #000;
      padding: 4px 10px;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .lang-switch button[aria-pressed="true"] {
      background: #000;
      color: #00ff00;
    }

    /* Arabic and Sorani run the other way */
    [dir="rtl"] .card ol {
      padding-left: 0;
      padding-right: 1.3rem;
    }
</style>
</head>

<body>
  <!-- the chrome is English, so it keeps its direction when the page flips to RTL -->
  <div class="back-link" dir="ltr">
    <a href="/">[← BACK TO MAIN]</a>
  </div>

  <div class="awareness-container">
    <div class="lang-switch" id="lang-switch" dir="ltr"></div>

    <div class="headline" dir="ltr">
      Welcome to
      <img src="../kyo_dot_sk_logo_vektorisiert_black.svg" alt="kyo.sk" class="headline-logo">
    </div>

    <main>
      <section class="card card-main" aria-labelledby="basics-heading">
        <h2 id="basics-heading"></h2>
        <ol id="basics-list"></ol>
      </section>

      <section class="card card-note">
        <p id="basics-note"></p>
      </section>
    </main>

    <div class="back-link" dir="ltr">
      <a href="/feedback/">[FEEDBACK →]</a>
    </div>
  </div>

        ],
        note: '*Herkese açık oturma odası, açılış saatleri içinde kapasitemize göre açıp kapattığımız anlamına gelir.'
      },
      ar: {
        name: 'العربية',
        dir: 'rtl',
        heading: 'الكيوسك غرفة معيشة عامة*:',
        rules: [
          'لا مكان هنا للتمييز الجنسي أو العنصرية أو أي شكل من أشكال التمييز! *على الجميع أن يشعروا بالارتياح، لذلك انتبهوا لبعضكم البعض!*',
          'الكيوسك مُدار ذاتيًا وسيبقى كذلك',
          'مبدأ التضامن: لا نهدف إلى الربح، خدمة ذاتية وتبرع مقترح بدلاً من إلزام الاستهلاك، خدمة وأسعار ثابتة - *لسنا مقهى أو مطعمًا* "ادفع فورًا، لا لاحقًا!" نعتمد على التبرعات',
          'أعيدوا الزجاجات وخذوا نفاياتكم معكم',
          'من فضلكم تقبّلوا رغبة العاملين في الإغلاق، ومراعاةً للجيران لا تبقوا أمام الكيوسك بعد الساعة العاشرة مساءً',
          'يسعدنا تلقّي ملاحظاتكم عبر البريد الإلكتروني (interym@riseup.net) أو في صندوق الاقتراحات'
        ],
        note: '*غرفة معيشة عامة تعني أننا نفتح ونغلق ضمن أوقات الدوام بحسب إمكانياتنا.'
      },
      ckb: {
        name: 'کوردی',
        dir: 'rtl',
        heading: 'کیۆسک ژووری دانیشتنی گشتییە*:',
        rules: [
          'لێرەدا شوێن نییە بۆ ڕەگەزپەرستی، نەژادپەرستی و هیچ جۆرێک لە جیاکاری! *دەبێت هەموو کەس هەست بە ئاسوودەیی بکات، بۆیە ئاگاداری یەکتر بن!*',

          'تکایە ڕازی بن کاتێک ئەو کەسانەی نۆرەیان هەیە دەیانەوێت دادخەن، و لە پێناو دراوسێکان دوای کاتژمێر ١٠ی شەو لەبەردەم کیۆسک نەمێننەوە',
          'بە خۆشحاڵییەوە ڕای خۆتان بە ئیمەیل (interym@riseup.net) یان لە سندوقی پێشنیارەکان بنێرن'
        ],
        note: '*ژووری دانیشتنی گشتی واتە لە ماوەی کاتەکانی کردنەوەدا بەپێی توانامان دەکەینەوە و دادەخەین.'

          '當值班的人想打烊時請體諒，並為了鄰居著想，晚上十點後請勿在 Kyosk 門前透留',
          '歡迎透過電子郵件（interym@riseup.net）或我們的意見箱給我們回饋'

        heading: 'Kyoskは公共のリビングルームです*：',
        rules: [
          'ここに性差別・人種差別、いかなる形の差別の居場所もありません！*-> みんなが心地よく過ごせるように、お互いを気にかけてください！*',
          'Kyoskは自主運営であり、これからもそうあり続けます',
          '連帯の原則：営利目的ではなく、セルフサービスと、消費の強制ではなく寄付のお願い、サービスと固定価格 - *飲食店ではありません* -> 「あとでより、今すぐ払うほうがいい！」寄付に支えられています',
          '空き瓶は返却し、ごみは持ち帰ってください',
          'シフトの人が閉めたいときは受け入れてください。近隣の方のために、22時以降はKyoskの前にとどまらないでください',

        ],
        note: '*公共のリビングルームとは、営業時間内で人手の状況に応じて開けたり閉めたりするという意味です。'
        }
    };

    const LANGS = ['de', 'en', 'es', 'pt', 'fr', 'it', 'tr', 'ar', 'ckb', 'zh', 'ja'];
    const STORED_LANG = 'kyosk-lang';   // shared with the awareness and feedback pages
    const CREW_MAIL = 'interym@riseup.net';

    let lang = pickLang();

    // A stored choice wins, otherwise the browser's own languages decide, German last resort
    function pickLang() {
      try {
        const saved = localStorage.getItem(STORED_LANG);
        if (LANGS.indexOf(saved) !== -1) return saved;
      } catch (e) { /* storage can be switched off */ }
      for (const tag of (navigator.languages || [navigator.language || ''])) {
        const code = String(tag).toLowerCase();
        // ckb before the two-letter check, it is the only three-letter code here
        if (code.startsWith('ckb')) return 'ckb';
        const short = code.slice(0, 2);
        if (LANGS.indexOf(short) !== -1) return short;
      }
      return 'de';
    }

    // Turns one line into nodes: *stars* become bold, the crew address a mail link.
    // Everything goes in as text, so nothing in CONTENT can smuggle in markup.
    function fill(element, line) {
      element.textContent = '';
      line.split('*').forEach((piece, index) => {
        const host = index % 2 ? document.createElement('strong') : element;
        piece.split(CREW_MAIL).forEach((part, i) => {
          if (i) {
            const link = document.createElement('a');
            link.href = 'mailto:' + CREW_MAIL;
            link.textContent = CREW_MAIL;
            host.appendChild(link);
          }
          if (part) host.appendChild(document.createTextNode(part));
        });
        if (host !== element) element.appendChild(host);
      });
    }

    function render() {
      const text = CONTENT[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = text.dir || 'ltr';
      document.getElementById('basics-heading').textContent = text.heading;
      fill(document.getElementById('basics-note'), text.note);

      const list = document.getElementById('basics-list');
      list.textContent = '';
      text.rules.forEach(rule => {
        const item = document.createElement('li');
        fill(item, rule);
        list.appendChild(item);
      });

      [...document.querySelectorAll('#lang-switch button')].forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.lang === lang));
      });
    }

    // the switcher names each language in that language, so it can be found without
    // knowing any of the others
    const switcher = document.getElementById('lang-switch');
    LANGS.forEach(code => {
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.lang = code;
      button.lang = code;
      button.textContent = CONTENT[code].name;
      switcher.appendChild(button);
    });

    switcher.addEventListener('click', event => {
      const button = event.target.closest('button[data-lang]');
      if (!button) return;
      lang = button.dataset.lang;
      try { localStorage.setItem(STORED_LANG, lang); } catch (e) { /* storage off */ }
      render();
    });

    render();
  </script>
</body>

</html>
